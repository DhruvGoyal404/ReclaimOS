# Postgres and Redis are OPTIONAL. The default SQLite path needs none of this --
# a clean clone runs the full evaluation with no Docker at all (see ADR-0004).
#
#   docker compose --profile full up -d
#
# Then point RECLAIMOS_DATABASE_URL / RECLAIMOS_REDIS_URL at these services.

services:
  postgres:
    image: postgres:16-alpine
    profiles: [full]
    environment:
      POSTGRES_USER: reclaimos
      POSTGRES_PASSWORD: reclaimos
      POSTGRES_DB: reclaimos
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reclaimos"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    profiles: [full]
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
  redisdata:
