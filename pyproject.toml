[project]
name = "reclaimos"
version = "0.1.0"
description = "Autonomous, fully-auditable recovery of revenue lost to failed recurring payments."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
authors = [{ name = "Dhruv Goyal" }]
dependencies = [
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "typer>=0.12",
    "rich>=13.7",
    "tzdata>=2024.1",  # Windows has no system tz database; zoneinfo needs this
]

[project.optional-dependencies]
# The explainer degrades to a deterministic template without this, which is
# the path CI and a first clone both take. Keeping it optional means the core
# install needs no credentials and no network.
llm = ["anthropic>=0.40"]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
]

[project.scripts]
reclaimos = "reclaimos.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/reclaimos"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501"]
# Typography we use deliberately in generated Markdown and docstrings.
allowed-confusables = ["–", "—", "·", "₹", "→", "×"]

[tool.mypy]
python_version = "3.12"
packages = ["reclaimos"]
mypy_path = "src"
strict = true
warn_return_any = true
disallow_untyped_defs = true

# The Anthropic SDK is an optional extra, so it is legitimately absent from the
# default environment. When it IS installed, mypy uses its real types.
[[tool.mypy.overrides]]
module = "anthropic.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = ["slow: long-running eval runs"]
